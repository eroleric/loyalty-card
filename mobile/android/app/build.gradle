plugins { id 'com.android.application' }
android {
    namespace 'com.loyaltycard.prototype'
    compileSdk 36
    defaultConfig {
        applicationId 'com.loyaltycard.prototype'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1-test'
        testInstrumentationRunner 'com.loyaltycard.prototype.EnrollmentProbe'
    }
    sourceSets { main { assets.srcDirs += '../../../dist' } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
